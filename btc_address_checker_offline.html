<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTC Address Equivalence Checker (Offline)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 650px; margin: 2rem auto; }
  input, button { width: 100%; padding: .6rem; margin-top: .5rem; font-size: 1rem; }
  pre { background:#f6f6f6; padding:1rem; border-radius:8px; }
  .ok { color:green; }
  .no { color:red; }
</style>
</head>
<body>
<h2>Bitcoin Mainnet ↔ Testnet Address Checker (Offline)</h2>

<label>Address A (mainnet or testnet):</label>
<input id="addrA" placeholder="bc1... or 1... or m...">

<label>Address B (mainnet or testnet):</label>
<input id="addrB" placeholder="tb1... or m... or 1...">

<button id="btn">Compare</button>

<pre id="out"></pre>

<script>
// --- Minimal Base58Check decoder ---
const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const ALPHABET_MAP = {}; for (let i=0;i<ALPHABET.length;i++) ALPHABET_MAP[ALPHABET[i]]=i;

function sha256(buf){return crypto.subtle.digest('SHA-256', buf);}
async function base58checkDecode(str){
  let num = 0n;
  for(const c of str){ num = num*58n + BigInt(ALPHABET_MAP[c]); }
  let bytes=[]; while(num>0n){bytes.unshift(Number(num&255n));num>>=8n;}
  for(const c of str){ if(c==='1') bytes.unshift(0); else break; }
  const data = new Uint8Array(bytes);
  const body = data.slice(0,-4), checksum = data.slice(-4);
  const hash = new Uint8Array(await sha256(await sha256(body)));
  for(let i=0;i<4;i++) if(hash[i]!==checksum[i]) throw new Error("Bad checksum");
  return body;
}

// --- Minimal Bech32 decoder (works for bc1/tb1) ---
const BECH32_ALPHABET="qpzry9x8gf2tvdw0s3jn54khce6mua7l";
function bech32Polymod(values){
  const GENERATORS=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
  let chk=1; for(const v of values){
    const top=chk>>25;
    chk=(chk&0x1ffffff)<<5 ^ v;
    for(let i=0;i<5;i++) if((top>>i)&1) chk^=GENERATORS[i];
  } return chk;
}
function bech32HrpExpand(hrp){
  const ret=[]; for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)>>5);
  ret.push(0); for(let i=0;i<hrp.length;i++) ret.push(hrp.charCodeAt(i)&31);
  return ret;
}
function bech32VerifyChecksum(hrp,data){
  return bech32Polymod([...bech32HrpExpand(hrp),...data])===1;
}
function bech32Decode(bech){
  bech = bech.toLowerCase();
  const pos = bech.lastIndexOf("1");
  const hrp = bech.slice(0,pos);
  const data = [...bech.slice(pos+1)].map(c=>BECH32_ALPHABET.indexOf(c));
  if(!bech32VerifyChecksum(hrp,data)) throw new Error("Bad bech32 checksum");
  return {hrp, words:data.slice(0,-6)};
}
function bech32FromWords(words){
  let bits=0, value=0, out=[];
  for(const w of words){ value=(value<<5)|w; bits+=5;
    if(bits>=8){ bits-=8; out.push((value>>bits)&0xff); }
  }
  return new Uint8Array(out);
}

// --- Comparison logic ---
function bytesToHex(b){return Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");}

async function decodeAddress(addr){
  addr = addr.trim();
  if(addr.toLowerCase().startsWith("bc1")||addr.toLowerCase().startsWith("tb1")){
    const {hrp,words}=bech32Decode(addr);
    const prog=bech32FromWords(words.slice(1));
    return {type:"bech32",hrp,payload:bytesToHex(prog)};
  } else {
    const body=await base58checkDecode(addr);
    return {type:"base58",version:body[0],payload:bytesToHex(body.slice(1))};
  }
}

document.getElementById("btn").onclick = async () => {
  const a=document.getElementById("addrA").value.trim();
  const b=document.getElementById("addrB").value.trim();
  const out=document.getElementById("out");
  try{
    const A=await decodeAddress(a);
    const B=await decodeAddress(b);
    const same=(A.payload===B.payload && A.type===B.type);
    out.innerHTML=`A → ${JSON.stringify(A,null,2)}\n\nB → ${JSON.stringify(B,null,2)}\n\nResult: <strong class="${same?'ok':'no'}">${same?'Equivalent ✅':'Different ❌'}</strong>`;
  }catch(e){ out.innerHTML=`<span class=no>Error:</span> ${e.message}`; }
};
</script>
</body>
</html>
